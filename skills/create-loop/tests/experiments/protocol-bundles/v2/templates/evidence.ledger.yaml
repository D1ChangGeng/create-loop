# evidence.ledger — append-only record of gate verdicts.
# A node may transition verifying -> completed only when its unique current entry has verdict == pass.
# Tokens are LOCKED:
#   gate_kind: automated_check | test | llm_judge | self_consistency |
#              evaluator_optimizer | step_verifier | human_approval | artifact_exists
#   verdict:   pass | fail | inconclusive
#   verifier:  agent | subagent | user | script
#   assurance: external | blind | self_attested (provenance, orthogonal to gate_kind)
#   score:     number 0..1 for scored gates, or null for pass/fail gates
# Only active passing external evidence, or human_approval, may authorize completed.
# Passing self_attested evidence is provisional and can never satisfy done_when.
# assurance: blind additionally requires review_context.producer_claim_access: withheld.

schema_version: "1.0.0"           # version of THIS evidence.ledger schema

entries:                          # append-only; newest last. Each entry has all 10 required fields.
  # Example: a FAILED verdict from an earlier attempt (kept for the audit trail).
  - entry_id: "ev-0001"
    node_id: "build"
    gate_kind: "test"
    verdict: "fail"
    score: null                   # pass/fail gate => null
    artifact_path: "evidence/build_tests.attempt1.json"
    rationale: "3 of 40 unit tests failed on the first build attempt."
    recorded: "2026-07-02T10:20:00Z"   # ISO-8601 date-time
    verifier: "script"
    assurance: "external"        # process/test observation; not a claim of adequacy
    status: "active"              # immutable historical observation
    superseded_by: null            # legacy field; new records leave it null

  # Example: a PASS verdict from the successful re-attempt (made current below).
  - entry_id: "ev-0002"
    node_id: "build"
    gate_kind: "test"
    verdict: "pass"
    score: null
    artifact_path: "evidence/build_tests.attempt2.json"
    rationale: "All 40 unit tests pass after the local patch."
    recorded: "2026-07-02T10:42:00Z"
    verifier: "script"
    assurance: "external"
    success_criteria_id: "sc-1"   # OPTIONAL citation; resolution does not establish satisfaction
    status: "active"              # only 'active' evidence may back a gate (R38)
    superseded_by: null

# Entries above remain immutable observations. Use append-only relations instead
# of editing an old verdict or lifecycle field.
relations:
  - relation_id: "rel-0001"
    source_entry_id: "ev-0002"
    target_entry_id: "ev-0001"
    relation: "supersedes"
    reason: "The second test run replaced the failed first-attempt result."
