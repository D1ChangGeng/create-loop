# Append-only event log — the authority for recorded effects and status
# transitions. Each node advance: 1) pre_effect  2) execute  3) post_effect.
# Replay yields node_states only WITH the plan and ledger (state_model.md,
# "The canonical checkpoint projection"): `completed` needs an authorizing
# ledger entry. `iteration`/`cost_units_spent` have no field here.
# Real logs are `event_log.jsonl` — one JSON object per line, no wrapper.
# This wrapper is what `--kind event_log` validates; that mismatch is an
# open defect, not a shape to copy.
schema_version: "1.0"
entries:
  - seq: 0
    node_id: n1_charter
    ts: "2026-07-02T14:00:00Z"
    kind: pre_effect
    effect_id: "charter-interview"
    attempt_id: "attempt-1"
    from_status: ready
    to_status: running
    phase: 0
    intent: "run the Charter interview"
    idempotency_key: "n1_charter#attempt1"
    result_hash: null
  - seq: 1
    node_id: n1_charter
    ts: "2026-07-02T14:03:00Z"
    kind: post_effect
    effect_id: "charter-interview"
    attempt_id: "attempt-1"
    from_status: running
    to_status: verifying        # NEVER `completed` — the ledger decides that
    outcome: ok
    result_hash: "sha256:abc123"
  # A structured plan mutation (kind:mutation): typed + reasoned + evidenced (R39).
  - seq: 2
    node_id: n4_requirements
    ts: "2026-07-02T14:10:00Z"
    kind: mutation
    mutation_type: add_subgraph
    reason: "Gate found 3 acceptance criteria that are not verifiable."
    evidence_refs: ["ev-0002"]
